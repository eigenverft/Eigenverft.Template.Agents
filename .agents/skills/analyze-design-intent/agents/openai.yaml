interface:
  display_name: "Design Intent Analysis"
  short_description: "Reconstruct purpose, design reasoning, context, and trade-offs"
  default_prompt: "Use $analyze-design-intent as a read-only analysis of the selected technical target inherited from the current conversation when already established. Treat the target as the question boundary, not automatically the evidence boundary: inspect surrounding implementation, configuration, data/state, documentation, automation, metadata, usage, tests, or history only when that context can materially change the interpretation. Do not privilege code or force the target into a predefined artifact type. Abstract away from local project vocabulary and explain the target in neutral, transferable terms. Use low-level mechanisms such as retries, persistence, caches, schemas, fields, or formats primarily as internal evidence; surface them only when they explain why the design exists, how it behaves, what trade-off it makes, or what it enables. Reconstruct interaction and data/state semantics when relevant, distinguish observed meaning from inferred rationale and historical origin, and organize the final answer by the user's actual topic or discovered topics rather than by analysis stages, capability tables, or evidence ledgers. Keep all source and repository/workspace state unchanged."
