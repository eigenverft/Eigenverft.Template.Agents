interface:
  display_name: "Repository Intent Archaeology"
  short_description: "Discover code capabilities, design ideas, and likely purpose"
  default_prompt: "Use $review-repository-intent-archaeology as a source-first, read-only analysis of the selected codebase. First map the meaningful repository implementation areas, then explain what concrete capabilities or technical features each area provides, what problems those capabilities appear to solve, which underlying design ideas they embody, and what those ideas enable or are useful for. Lead the chat report with design ideas and a repository capability map rather than a long observation ledger. Trace major ideas to concise source evidence, consumers, tests, and Git history where useful; distinguish observed use, strongly implied utility, possible use, present design meaning, and historical origin. Compare independent ideas for broader design principles and competing hypotheses while keeping repository state unchanged."
