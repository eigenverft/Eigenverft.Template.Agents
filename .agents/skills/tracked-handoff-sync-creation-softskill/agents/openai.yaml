interface:
  display_name: "Tracked Handoff Sync Creation"
  short_description: "Sync and create initial tracked handoffs"
  default_prompt: "Use $tracked-handoff-sync-creation-softskill and apply its full SKILL.md contract. Fetch and preserve the complete canonical TRACKED_HANDOFFS tree from remote tracked-handoffs before investigation. Create an isolated managed Creation worktree and session, but author only TRACKED_HANDOFFS/INITIAL using initial-handoff-<12-character-hash>-NN-<topic>.md files; treat every other tracked-handoff phase area as read-only and preserve it from the latest remote state. Recover safe unpublished initial handoffs only from TRACKED_HANDOFFS/INITIAL. Preserve the current product branch and unrelated local work. Before any push, fetch the complete remote tree again, reapply only INITIAL additions, verify that no other path changed, push without force, verify the remote result, and refresh the complete product-worktree visibility mirror. Use intermediate publication for recovered initial handoffs while keeping the current Creation worktree, run branch, and session record. Use final publication at the end and clean only Creation-managed artifacts when safe. Independent sessions use separate phase-specific worktrees and sessions but share the repository publication lock with other tracked-handoff phases. Delegate only when the user explicitly asks for subagents; the parent alone publishes. Do not reconcile, plan, implement, or interpret lifecycle state. On success return only created TRACKED_HANDOFFS/INITIAL paths or exactly NO_HANDOFFS_CREATED; on synchronization or publication failure return the exact blocker instead."
