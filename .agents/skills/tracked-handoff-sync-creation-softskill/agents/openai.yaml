interface:
  display_name: "Tracked Handoff Sync Creation"
  short_description: "Create and sync initial handoffs through remote runs"
  default_prompt: "Use $tracked-handoff-sync-creation-softskill and apply its complete SKILL.md contract. Preserve the current product checkout and investigate it read-only. Use tracked-handoffs/initial/current as the integrated Initial collection and tracked-handoffs/initial/run/<12-character-hash> as the remotely saved result of each producing run. Before investigation, fetch the writable remote, reject the legacy tracked-handoffs branch when it still blocks the new namespace, validate the pure-storage Initial branches, integrate all safely recoverable open remote runs, and clean only run branches whose complete contribution is verified in current. Author only TRACKED_HANDOFFS/INITIAL using initial-handoff-<hash>-NN-<topic>.md files. When Handoffs are created, push and verify the unique remote run branch before attempting append-only integration into initial/current. Resolve concurrent current updates by fetch, rebuild, normal push, and the bounded increasing-backoff retries from SKILL.md; never force-push. A pending integration must leave the verified remote run branch available for recovery from another session or computer. Use the phase-specific local mirror lock only for short mirror reads, writes, and cleanup; it must not guard investigation, remote run pushes, or current integration. Delegate only when the user explicitly requests subagents; the parent alone performs Git operations and publishes one remote run branch per successful delegated producing run. Do not reconcile, plan, implement, or interpret lifecycle state. On success return only newly integrated TRACKED_HANDOFFS/INITIAL paths. When no Handoff qualifies, put NO_HANDOFFS_CREATED on the first line and, for a Markdown-based assignment, add only the cautious close/archive/delete recommendation allowed by SKILL.md without modifying the source. On failure or pending integration, state the exact local or remote preservation state and the next safe action."
