interface:
  display_name: "Tracked Sync Handoff Create"
  short_description: "Sync and create tracked cross-branch handoffs"
  default_prompt: "Use $tracked-sync-handoff-create-softskill and apply its full SKILL.md contract. Fetch the canonical published tracked-handoffs collection before investigation, create an isolated managed worktree and session, recover every safe unpublished handoff, and preserve the current product branch and unrelated local work. A document deliberately placed directly under TRACKED_HANDOFFS that clearly presents itself as a handoff signals publication intent; ordinary notes remain local. Use the 12-character identifier rules from the skill. Before any push, fetch again, combine append-only additions, publish only TRACKED_HANDOFFS without force, verify the remote result, and refresh the product-worktree visibility mirror. Use intermediate publication for handoffs recovered or published before the requested investigation, keeping the current worktree, run branch, and session record. Use final publication at the end of the run and clean managed artifacts only when safe. Independent sessions use separate worktrees and share the local publication lock only for publication. Delegate only when the user explicitly asks for subagents; the parent alone publishes. Do not interpret completion, supersession, or other lifecycle state. On success return only created repository-relative paths or exactly NO_HANDOFFS_CREATED; on synchronization or publication failure return the exact blocker instead."
