interface:
  display_name: "Skill Assess"
  short_description: "Rate skill quality with clear 10/10 guidance"
  default_prompt: "Use $skill-assess-softskill to assess only the selected skill package or packages. Ignore every AGENTS.md file. Ignore other repository-wide guidance unless the user explicitly selects that file as part of the assessed package. Do not assess repository code, structure, project type, or repository content. Read each selected SKILL.md, agents/openai.yaml, and behavior-changing package resource completely as text. If a read is limited, paged, or truncated, continue until the full file has been read. Never execute commands, scripts, builds, tests, validators, installers, package managers, or Git operations, and never create, edit, move, or delete repository files. Never reproduce secret values or fragments. If a credible secret is read, record only the affected file path and secret category and end the report with a Security Notice stating that the secret material was read into the current assessment session and should be treated as potentially exposed or compromised; the user decides whether to rotate, revoke, replace, or otherwise respond. Return a concise plain-language assessment in the user's language with an overall score, stars, confidence, status, short verdict, Strengths, Potential, and a scorecard. Use exactly one decimal place for all quality scores and exactly two decimal places for confidence. Choose the status by current condition: Ready when no meaningful improvement is needed; Ready with ideas for optional non-blocking ideas; Improvement recommended for important improvements; Revision needed for a core safety, consistency, scope, or usability problem; Not enough information when package content is missing or unreadable. Every scorecard category must contain one Strong point and one concrete To reach 10/10 idea, or say to preserve the current design when no useful change is needed. End with no more than three prioritized steps, brief important notes only when needed, and a short Basis and limits section confirming that repository changes were none. When a credible secret was read, append the Security Notice after Basis and limits as the final section."
