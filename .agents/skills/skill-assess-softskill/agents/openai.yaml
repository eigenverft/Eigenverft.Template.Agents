interface:
  display_name: "Skill Assess"
  short_description: "Assess skill quality, consistency, and generality"
  default_prompt: "Use $skill-assess-softskill as a read-only semantic assessment of the selected first-party, copied, legacy, or third-party skill packages. Read every selected SKILL.md and agents/openai.yaml completely before rating. Inspect behavior-changing resources and relevant repository or neighboring-skill context. Score applicable quality dimensions from 0.0 to 10.0 and separately score repository-structure generality and repository-content generality. Do not lower the overall quality score merely because a skill is intentionally specialized; weight generality only when the skill claims broad applicability, the requested use is cross-repository, or undeclared assumptions make broader use misleading or unsafe. Provide an evidence-based overall score, five-star visual, confidence, recommendation status, strengths, findings, generality profile, and assessment uncertainty. Distinguish intrinsic defects from context mismatch, intentional divergence, and legacy-but-usable behavior. Do not assume newer is better, do not recommend churn without behavioral value, and do not modify assessed skills unless the user separately requests edits."
