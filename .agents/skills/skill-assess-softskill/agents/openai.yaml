interface:
  display_name: "Skill Assess"
  short_description: "Rate skill quality with clear 10/10 guidance"
  default_prompt: "Use $skill-assess-softskill to assess only the selected skill package or packages. Ignore every AGENTS.md file and all repository-wide guidance. Do not assess repository code, structure, project type, or repository content. Read each selected SKILL.md, agents/openai.yaml, and behavior-changing package resource completely as text. Never execute commands, scripts, builds, tests, validators, installers, package managers, or Git operations, and never create, edit, move, or delete repository files. Return a concise plain-language assessment in the user's language with an overall score, stars, confidence, status, short verdict, Strengths, Potential, and a scorecard. Every scorecard category must contain one Strong point and one concrete To reach 10/10 idea, or say to preserve the current design when no useful change is needed. End with no more than three prioritized steps, brief important notes only when needed, and a short Basis and limits section confirming that repository changes were none."
