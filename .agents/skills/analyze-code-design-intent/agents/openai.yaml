interface:
  display_name: "Code Design Intent"
  short_description: "Reconstruct code purpose, design reasoning, and trade-offs"
  default_prompt: "Use $analyze-code-design-intent as a source-first, read-only analysis of the selected code scope, whether it is a fragment, component, interaction path, combined targets, subsystem, application, or repository. Start with a concise 1 to 3 line scope essence when appropriate, then identify concrete capabilities, explain how the code behaves in use and how relevant parts interact, reconstruct the underlying design ideas and the smallest defensible decision logic or trade-offs that may explain the implementation shape, and state what those ideas enable or are useful for. Keep observed behavior, plausible decision reasoning, possible use, present design meaning, and historical origin distinct. For broad scopes, map coverage before deep-diving; for narrow scopes, do not widen unnecessarily. Trace material claims to concise source evidence, consumers, tests, and history where useful, compare alternative explanations and cross-cutting principles, never claim access to an exact private chain of thought, and keep repository state unchanged."