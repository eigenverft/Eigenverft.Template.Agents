interface:
  display_name: "Repo Workspace Sync and Publish"
  short_description: "Discover, synchronize, and publish Git repositories"
  default_prompt: "Use $repo-sync-workspace-publish to discover the repository or workspace targets, synchronize only their actual unpublished Git state, publish with normal pushes, and verify every remote head without adding unrelated builds, tests, product work, or artifact publication."
