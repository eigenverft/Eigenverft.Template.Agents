interface:
  display_name: "Execute Repo Workspace Sync and Publish"
  short_description: "Discover, synchronize, and publish Git repositories"
  default_prompt: "Use $execute-repo-workspace-sync-and-publish to discover the repository or workspace targets and synchronize every relevant branch, not only the current checkout. Preserve all worktrees and working changes; fetch and prune complete remote branch namespaces without tags; distinguish actual remote, remote-tracking, and local tracking branches; create only unambiguous required tracking branches; proportionally assess local-only branch and working-change publication intent; integrate without rewriting history; publish with explicit normal branch pushes; independently verify every relevant remote head; and do not add unrelated builds, tests, product work, artifact publication, tag operations, branch deletion, or force-push behavior."
